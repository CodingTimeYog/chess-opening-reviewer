[project]
name = "chess-trainer"
version = "0.1.0"
description = "RAG-augmented chess opening trainer (CS4710 final project)"
requires-python = ">=3.13"
dependencies = [
    "chess>=1.11",
    "pandas>=2.2",
    "pyarrow>=18",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
